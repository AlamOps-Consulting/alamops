name: alamops-web develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: alamops-web-develop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secure-pipeline:
    uses: ./.github/workflows/secure_pipeline.yml
    with:
      publish_image: false
    secrets: inherit
