name: Reusable secure alamops-web pipeline

on:
  workflow_call:
    inputs:
      publish_image:
        required: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.17.1"
  SONAR_HOST_URL: https://sonarqube.alamops.com
  SONAR_PROJECT_KEY: alamops-web
  IMAGE_NAME: fjvigil/alamops-web
  EXTERNAL_REPO: AlamOps-Consulting/alamops_kube_prod.git
  EXTERNAL_REPO_BRANCH: master
  MANIFEST_PATH: 07-applications/alamops-web/deployment.yml
  NEXT_PUBLIC_API_URL: https://back.alamops.com

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Verify LCOV report
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
          grep -q '^DA:' coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alamops-web-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm lint --max-warnings=0

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript compiler
        run: pnpm typecheck

  application-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build

  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Audit locked dependencies
        run: pnpm audit --audit-level high

  source-security:
    name: Source, secrets and configuration security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

  sonarqube:
    name: SonarQube Quality Gate
    needs: tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: alamops-web-coverage-${{ github.run_id }}
          path: .
      - name: Analyze and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=alamops-web
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
            -Dsonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  container-security:
    name: Build, scan and optionally publish image
    needs: [tests, lint, typecheck, application-build, dependency-security, source-security, sonarqube]
    if: ${{ always() && !cancelled() && needs.tests.result == 'success' && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.application-build.result == 'success' && needs.dependency-security.result == 'success' && needs.source-security.result == 'success' && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
      - name: Scan final image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: alamops-web-sbom.cdx.json
          exit-code: "0"
          hide-progress: true
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alamops-web-sbom-${{ github.sha }}
          path: alamops-web-sbom.cdx.json
          if-no-files-found: error
          retention-days: ${{ inputs.publish_image && 90 || 30 }}
      - name: Login to Docker Hub
        if: ${{ inputs.publish_image }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable image and latest alias
        id: publish
        if: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}" | tee push-output.txt
          digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' push-output.txt | tail -1)"
          test -n "${digest}" || { echo "Unable to determine pushed digest" >&2; exit 1; }
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  gitops:
    name: Update production GitOps manifest
    needs: container-security
    if: ${{ inputs.publish_image && needs.container-security.outputs.image-digest != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitOps repository
        env:
          EXTERNAL_REPO_AUTH: ${{ secrets.EXTERNAL_REPO_AUTH }}
        run: |
          set -euo pipefail
          test -n "${EXTERNAL_REPO_AUTH}" || { echo "EXTERNAL_REPO_AUTH is not configured" >&2; exit 1; }
          case "${EXTERNAL_REPO_AUTH}" in
            *:*) auth_payload="${EXTERNAL_REPO_AUTH}" ;;
            *) auth_payload="x-access-token:${EXTERNAL_REPO_AUTH}" ;;
          esac
          auth_header="$(printf '%s' "${auth_payload}" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            clone --depth 1 --branch "${EXTERNAL_REPO_BRANCH}" \
            "https://github.com/${EXTERNAL_REPO}" external-repo
      - name: Update image by immutable digest
        working-directory: external-repo
        env:
          IMAGE_DIGEST: ${{ needs.container-security.outputs.image-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path(os.environ["MANIFEST_PATH"])
          digest = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Invalid image digest: {digest!r}")
          if not manifest.is_file():
              raise SystemExit(f"Manifest does not exist: {manifest}")

          current = manifest.read_text()
          pattern = re.compile(
              r"(^\s*image:\s*)fjvigil/alamops-web(?:[:@][^\s#]+)(\s*(?:#.*)?$)",
              re.MULTILINE,
          )
          updated, count = pattern.subn(rf"\1fjvigil/alamops-web@{digest}\2", current)
          if count != 1:
              raise SystemExit(f"Expected exactly one alamops-web image, found {count}")
          manifest.write_text(updated)
          PY
          git diff --check
          git --no-pager diff -- "${MANIFEST_PATH}"
      - name: Commit and push manifest update
        working-directory: external-repo
        env:
          EXTERNAL_REPO_AUTH: ${{ secrets.EXTERNAL_REPO_AUTH }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "${MANIFEST_PATH}"; then
            echo "Manifest already references the requested digest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          git commit -m "chore(alamops-web): deploy ${GITHUB_SHA}"
          case "${EXTERNAL_REPO_AUTH}" in
            *:*) auth_payload="${EXTERNAL_REPO_AUTH}" ;;
            *) auth_payload="x-access-token:${EXTERNAL_REPO_AUTH}" ;;
          esac
          auth_header="$(printf '%s' "${auth_payload}" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin "${EXTERNAL_REPO_BRANCH}"
